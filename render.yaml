{
  "services": [{
    "type": "web",
    "name": "knowvia-university-demo",
    "runtime": "docker",
    "plan": "free",
    "dockerfilePath": "./Dockerfile",
    "dockerContext": ".",
    "autoDeployTrigger": "off",
    "healthCheckPath": "/health",
    "envVars": [
      {"key": "EMBEDDING_PROVIDER", "value": "onnx"},
      {"key": "KNOWVIA_EMBEDDING_PROVIDER", "value": "onnx"},
      {"key": "KNOWVIA_ENVIRONMENT", "value": "demo"},
      {"key": "PORT", "value": "10000"},
      {"key": "KNOWVIA_ALLOWED_HOSTS", "sync": false},
      {"key": "KNOWVIA_AUTH_COOKIE_SECURE", "value": "true"},
      {"key": "KNOWVIA_ALLOW_DEVELOPMENT_IDENTITY_OVERRIDE", "value": "false"},
      {"key": "KNOWVIA_SEED_DEMO_EMPLOYEE_DIRECTORY", "value": "true"},
      {"key": "KNOWVIA_REGISTRATION_ENABLED", "value": "false"},
      {"key": "KNOWVIA_ALLOW_DEVELOPER_DETAILS", "value": "false"},
      {"key": "KNOWVIA_DEBUG", "value": "false"},
      {"key": "KNOWVIA_ENABLE_HSTS", "value": "true"},
      {"key": "KNOWVIA_AGENT_TOOL", "value": "mock"},
      {"key": "KNOWVIA_MCP_TICKET_BACKEND", "value": "mock"},
      {"key": "KNOWVIA_ENABLE_REAL_JIRA_MUTATIONS", "value": "false"},
      {"key": "KNOWVIA_AGENT_ROUTER", "value": "gemini"},
      {"key": "GEMINI_ROUTER_MODEL", "value": "gemini-3.6-flash"},
      {"key": "GEMINI_ROUTER_TIMEOUT_SECONDS", "value": "30"},
      {"key": "GEMINI_API_KEY", "sync": false},
      {"key": "KNOWVIA_GENERATION_PROVIDER", "value": "groq"},
      {"key": "KNOWVIA_EVIDENCE_EVALUATOR", "value": "groq"},
      {"key": "GROQ_API_KEY", "sync": false},
      {"key": "GROQ_GENERATION_MODEL", "value": "openai/gpt-oss-120b"},
      {"key": "GROQ_EVIDENCE_MODEL", "value": "openai/gpt-oss-120b"},
      {"key": "GROQ_TIMEOUT_SECONDS", "value": "120"},
      {"key": "GROQ_EVIDENCE_REASONING_EFFORT", "value": "medium"},
      {"key": "GROQ_GENERATION_REASONING_EFFORT", "value": "low"},
      {"key": "GROQ_EVIDENCE_MAX_COMPLETION_TOKENS", "value": "2048"},
      {"key": "GROQ_GENERATION_MAX_COMPLETION_TOKENS", "value": "1024"},
      {"key": "FORWARDED_ALLOW_IPS", "value": "*"}
    ]
  }]
}
