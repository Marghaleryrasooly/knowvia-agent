[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "knowvia-agent"
version = "0.1.0"
description = "A small, educational local RAG pipeline with grounded answers"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "argon2-cffi>=23.1,<26",
    "numpy>=1.26,<3",
    "python-dotenv>=1.0,<2",
    "mcp>=2.0,<3",
    "starlette>=1.0,<2",
    "uvicorn>=0.31,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "sentence-transformers>=5.0,<6"]
local = ["sentence-transformers>=5.0,<6"]
onnx = ["onnxruntime>=1.24,<2", "tokenizers>=0.22,<0.23"]
openai = ["openai>=1.0,<3"]
gemini = ["google-genai>=2.0,<3"]

[project.scripts]
knowvia = "knowvia.cli:main"
knowvia-web = "knowvia.web:main"
knowvia-production = "knowvia.production:main"
knowvia-readiness = "knowvia.deployment_readiness:main"
knowvia-repository-safety = "knowvia.repository_safety:main"

[tool.hatch.build.targets.wheel]
packages = ["src/knowvia"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "embedding_parity: offline comparison requiring installed reference/ONNX runtimes and pinned assets",
    "local_model: loads the configured local sentence-transformers model",
    "live: calls the OpenAI API and requires OPENAI_API_KEY",
    "ollama_live: calls a locally running Ollama model",
    "m3_live: runs live evidence-sufficiency behavior with Ollama",
    "m4_live: runs the full local M4 evaluation with embeddings and Ollama",
    "m5_live: runs optional live M5 routing behavior",
    "gemini_live: calls Gemini with fictional routing-only requests",
    "jira_live: calls a configured Jira sandbox",
]
